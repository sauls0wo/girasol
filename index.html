<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #39204f, #160d22 60%, #09050e);

            color: white;
        }

        .contenedor {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .mensaje {
            background: rgba(255, 255, 255, 0.08);
            padding: 35px 25px;
            border-radius: 25px;

            box-shadow:
                0 0 30px rgba(255, 210, 100, 0.15);

            backdrop-filter: blur(10px);

            animation: aparecer 1.5s ease;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;

            padding: 14px 28px;

            border: none;
            border-radius: 30px;

            background: #ffcc4d;
            color: #3b2500;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 20px #ffcc4d;
        }

        #flor {
            display: none;
            position: relative;

            width: 100%;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .final {
            position: absolute;

            bottom: 40px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 24px;
            font-weight: bold;

            opacity: 0;

            animation: aparecerFinal 3s ease forwards;
            animation-delay: 5s;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes aparecerFinal {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor" id="inicio">

        <div class="mensaje">

            <h1>Para ti chula </h1>

            <p>
                Hice este detalle para ti,
                espero te guste y podamos
                solucionar lo nuestro
                ❤️
            </p>

            <button onclick="mostrarFlor()">
                Aceptar 
            </button>

        </div>

    </div>


    <div id="flor">

        <canvas id="canvas"></canvas>

        <div class="final">
            Para ti mensa ❤️
        </div>

    </div>


    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let ancho;
        let alto;

        function ajustarCanvas() {

            ancho = canvas.width = window.innerWidth;
            alto = canvas.height = window.innerHeight;

        }

        window.addEventListener("resize", ajustarCanvas);


        function mostrarFlor() {

            document.getElementById("inicio").style.display = "none";

            document.getElementById("flor").style.display = "block";

            ajustarCanvas();

            animarGirasol();

        }


        function animarGirasol() {

            let inicio = performance.now();

            function animar(tiempo) {

                let progreso = (tiempo - inicio) / 5000;

                if (progreso > 1) {
                    progreso = 1;
                }

                ctx.clearRect(0, 0, ancho, alto);

                dibujarGirasol(progreso);

                if (progreso < 1) {

                    requestAnimationFrame(animar);

                }

            }

            requestAnimationFrame(animar);

        }


        function dibujarGirasol(progreso) {

            const x = ancho / 2;

            const baseY = alto * 0.9;

            const florY = alto * 0.35;

            /*
             * TALLO
             */

            ctx.beginPath();

            ctx.moveTo(x, baseY);

            ctx.lineTo(
                x,
                baseY - (baseY - florY) * progreso
            );

            ctx.strokeStyle = "#4caf50";
            ctx.lineWidth = 12;
            ctx.lineCap = "round";

            ctx.stroke();


            /*
             * HOJA IZQUIERDA
             */

            if (progreso > 0.35) {

                ctx.beginPath();

                ctx.ellipse(
                    x - 35,
                    baseY - 180,
                    65,
                    25,
                    -0.5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "#3c9b45";

                ctx.fill();

            }


            /*
             * HOJA DERECHA
             */

            if (progreso > 0.45) {

                ctx.beginPath();

                ctx.ellipse(
                    x + 35,
                    baseY - 250,
                    65,
                    25,
                    0.5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "#3c9b45";

                ctx.fill();

            }


            /*
             * PÉTALOS
             */

            if (progreso > 0.55) {

                let cantidad = 24;

                let visibles = Math.floor(
                    cantidad * ((progreso - 0.55) / 0.45)
                );

                if (visibles > cantidad) {
                    visibles = cantidad;
                }

                for (let i = 0; i < visibles; i++) {

                    let angulo =
                        (Math.PI * 2 / cantidad) * i;

                    dibujarPetalo(
                        x,
                        florY,
                        angulo
                    );

                }

            }


            /*
             * CENTRO DEL GIRASOL
             */

            if (progreso > 0.75) {

                ctx.beginPath();

                ctx.arc(
                    x,
                    florY,
                    65,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "#5a320d";

                ctx.fill();


                /*
                 * SEMILLAS
                 */

                for (let i = 0; i < 80; i++) {

                    let angulo = i * 2.4;

                    let radio = 10 + (i % 5) * 10;

                    let sx =
                        x + Math.cos(angulo) * radio;

                    let sy =
                        florY + Math.sin(angulo) * radio;

                    ctx.beginPath();

                    ctx.arc(
                        sx,
                        sy,
                        3,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = "#2b1808";

                    ctx.fill();

                }

            }

        }


        function dibujarPetalo(x, y, angulo) {

            ctx.save();

            ctx.translate(x, y);

            ctx.rotate(angulo);

            ctx.beginPath();

            ctx.ellipse(
                0,
                -85,
                25,
                65,
                0,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#ffd83d";

            ctx.fill();

            ctx.restore();

        }

    </script>

</body>
</html>
